packages:
  - libs/*
  - apps/*

# pnpm 12 reads this here, not from package.json's `pnpm` field.
allowBuilds:
  '@swc/core': true
  'esbuild': true
  'nx': true

# Keep the `packageManager` pin out of pnpm-lock.yaml. With it recorded, pnpm 12 writes the
# lockfile as a two-document YAML stream (`packageManagerDependencies` first), which Nx 20's
# lockfile parser rejects with "expected a single document in the stream, but found more".
# Corepack still enforces the pinned pnpm version from package.json; this only stops pnpm's
# own re-check and the lockfile record of it.
pmOnFail: ignore
