# <AppName> local-dev full stack. Lives under tools/localdev/ — run it with the helper:
#
#   tools/localdev/stack.sh up        # build + start (detached)
#   tools/localdev/stack.sh down      # stop + remove
#
# (or directly: `docker compose -f tools/localdev/docker-compose.yml up --build`)
#
# Everything is reachable on http://*.<app-name>.localhost (browsers auto-resolve *.localhost to
# 127.0.0.1 — no /etc/hosts edits):
#   app.<app-name>.localhost                       → frontend (SSR BFF)
#   app.<app-name>.localhost/api/                  → backend API (same origin, like the prod nginx proxy)
#   app.<app-name>.localhost/auth/realms|resources → Keycloak OIDC (same origin as the app, like prod)
#   api.<app-name>.localhost                       → backend API (Scalar/Swagger, curl; local only)
#   keycloak.<app-name>.localhost/auth/admin       → Keycloak admin console (never on the app host)
#   redisinsight.<app-name>.localhost              → RedisInsight
#   localhost:8080                                 → Traefik dashboard
#
# Routing: every host/path rule is in traefik/dynamic.yml. Routes to an app that is not running
# answer 502.
#
# Frontend + backend run with live reload: source is bind-mounted from apps/* and they run in watch
# mode (Vite HMR / `dotnet watch`). First start is slow (in-container restore/install); later starts
# reuse the named caches. Dev secrets are non-sensitive local defaults.
#
# Paths below are relative to THIS file (tools/localdev/): repo-root assets use ../../.

name: <app-name>

services:
  proxy:
    image: traefik:v3.7
    command:
      # All routes live in traefik/dynamic.yml (file provider): one source of truth, no docker socket.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      # Dashboard for local debugging (which routers/services/providers are live).
      # insecure => served on :8080 without auth; bound to 127.0.0.1 below, dev stack only.
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      # Loopback only, like Postgres: the dashboard is unauthenticated and Keycloak's admin is admin/admin.
      - "127.0.0.1:80:80"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    networks:
      default:
        # Containers resolve the public hostnames to Traefik too, so the backend reaches the Keycloak
        # issuer on the app host at the same URL the browser uses.
        aliases:
          - app.<app-name>.localhost
          - api.<app-name>.localhost
          - keycloak.<app-name>.localhost
          - redisinsight.<app-name>.localhost

  postgres:
    # Built rather than pulled: the cluster's image is a Postgres 18 base plus pg_cron and pg_partman,
    # matching production's partition lifecycle. See postgres.dev.Dockerfile.
    build:
      context: .
      dockerfile: postgres.dev.Dockerfile
    # pg_cron has to be in shared_preload_libraries to load at all, and it runs its jobs in exactly one
    # database, named here. Without both settings `CREATE EXTENSION pg_cron` fails outright.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=<app-name>
    environment:
      POSTGRES_USER: <app-name>
      POSTGRES_PASSWORD: <app-name>
      POSTGRES_DB: <app-name>
    ports:
      # Exposed for local DB tooling (DBeaver, psql). Bound to 127.0.0.1 deliberately: a bare "5432:5432"
      # listens on every interface, and the credentials here are the well-known dev pair, so anything that
      # could reach this machine would have the database. Loopback-only still reaches DBeaver on localhost.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U <app-name> -d <app-name>"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # postgres:18+ stores data under a major-version subdir; mount the parent, not /data.
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  redisinsight:
    image: redis/redisinsight:2.70
    volumes:
      - redisinsight:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Like production: served under /auth, hostname taken from the forwarded host, so the app host
      # (OIDC) and the keycloak host (admin console) each get their own correct URLs.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Keycloak's own data (its dev database lives in data/h2), so users, sessions and console changes
      # survive restarts. Mounted on data/, not data/h2: h2 does not exist in the image, so a volume there
      # is created root-owned and Keycloak (uid 1000) cannot write it. The realm file is imported only into
      # an empty Keycloak: after editing it, `stack.sh down -v` (drops this and pgdata).
      - kcdata:/opt/keycloak/data

  # Grants the API's service account the realm-management roles it needs to manage users.
  #
  # This cannot be done declaratively. A `users` entry carrying `clientRoles` and a
  # `serviceAccountClientId` does not attach them to the client's service account: importing the
  # client creates that account itself, and the `users` entry then imports as a SECOND, orphan user
  # of the same name. The roles land on the orphan, the real service account has none, and every
  # /api/users call fails with a 403 from Keycloak. So the entry is gone from the realm JSON and the
  # grant happens here, against the account the client actually owns — looked up by id, since the
  # name alone was exactly what was ambiguous.
  #
  # Runs once per `up` and exits; re-granting an existing role mapping is a no-op, so it is safe to
  # repeat. The backend waits for it to succeed.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.8
    depends_on:
      keycloak:
        condition: service_started
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        kcadm=/opt/keycloak/bin/kcadm.sh
        realm=<Realm>
        for i in $$(seq 1 60); do
          "$$kcadm" config credentials --server http://keycloak:8080/auth --realm master \
            --user admin --password admin >/dev/null 2>&1 && break
          sleep 2
        done
        cid=$$("$$kcadm" get clients -r "$$realm" -q clientId=<app-name>_api \
          --fields id --format csv --noquotes)
        said=$$("$$kcadm" get "clients/$$cid/service-account-user" -r "$$realm" \
          --fields id --format csv --noquotes)
        "$$kcadm" add-roles -r "$$realm" --uid "$$said" --cclientid realm-management \
          --rolename manage-users --rolename view-users --rolename query-users
        echo "keycloak-init: granted realm-management roles to service account $$said"
    restart: "no"

  backend:
    build:
      context: ../../apps/backend
      dockerfile: ../../tools/localdev/backend.dev.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # The issuer is on the app host, exactly as the browser sees it (see the proxy's network aliases).
      Keycloak__Authority: http://app.<app-name>.localhost/auth/realms/<Realm>
      Keycloak__Audience: ""
      Keycloak__ClientId: <app-name>_api
      Keycloak__ClientSecret: <app-name>-dev-secret
      Keycloak__CallbackUri: http://app.<app-name>.localhost/api/auth/callback
      Keycloak__PostLogoutRedirectUri: http://app.<app-name>.localhost
      Keycloak__AppBaseUrl: http://app.<app-name>.localhost
      SessionCookies__SessionName: <app-name>_sid
      SessionCookies__PkceName: <app-name>_pkce
      AllowedCorsOrigins__0: http://app.<app-name>.localhost
      AllowedCorsOrigins__1: http://localhost:3000
      # Anchored regex for origins with too many subdomains to list one by one. Sample — replace or drop.
      AllowedCorsOriginPatterns__0: ^https://[a-z0-9-]+\.example\.com$
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=<app-name>;Username=<app-name>;Password=<app-name>"
      ConnectionStrings__Redis: "redis:6379"
    volumes:
      - ../../apps/backend:/src
      # Keep host-built artifacts out of the container (and vice versa).
      - /src/bin
      - /src/obj
    healthcheck:
      # The first start restores and builds inside the container, so give it time before counting failures.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s
    # No extra_hosts: the proxy's network alias resolves app.<app-name>.localhost to Traefik on this
    # network, and Traefik's ports are loopback-only, so the host gateway could not reach them anyway.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      keycloak-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../..
      dockerfile: tools/localdev/frontend.dev.Dockerfile
    environment:
      # Server-side only; never exposed to the client bundle. The SSR server is the BFF.
      API_URL: http://backend:8080
      DOCKER_DEV: "1"
    volumes:
      - ../../apps/frontend:/app/apps/frontend
      - ../../package.json:/app/package.json
      - ../../pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ../../.npmrc:/app/.npmrc
      # Keep node_modules in the container (don't let the host's shadow it).
      - /app/node_modules
      - /app/apps/frontend/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  redisinsight:
  kcdata:

networks:
  default:
    name: <app-name>
