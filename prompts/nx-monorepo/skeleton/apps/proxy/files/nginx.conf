worker_processes auto;
error_log /var/log/nginx/error.log crit;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    accept_mutex off;
}

http {
    # The Route terminates TLS and forwards over HTTP; default to https since it is the only way in.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      https;
    }

    # HSTS only over HTTPS; nginx omits an add_header whose value is empty.
    map $forwarded_proto $hsts_value {
        https   "max-age=31536000; includeSubDomains";
        default "";
    }

    log_format container
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'xff="$http_x_forwarded_for" '
        'rt=$request_time '
        'uct="$upstream_connect_time" '
        'uht="$upstream_header_time" '
        'urt="$upstream_response_time" '
        '$request_method $uri$is_args$args';

    access_log /dev/stdout container;

    client_body_buffer_size       10K;
    client_header_buffer_size     1k;
    client_max_body_size          8m;
    large_client_header_buffers   4 4k;
    client_body_timeout           12;
    client_header_timeout         12;
    keepalive_timeout             15;
    send_timeout                  10;
    server_tokens                 off;

    proxy_send_timeout            24;
    proxy_read_timeout            24;
    proxy_connect_timeout         20;
    proxy_buffer_size             16k;
    proxy_buffers                 16 16k;
    proxy_busy_buffers_size       32k;

    tcp_nodelay on;

    # Single public origin, so no CORS layer and no cookie re-homing. X-Real-IP is the Route, not the
    # client; for the real client IP, enable realip with the Route/pod network as trusted.
    proxy_set_header X-Forwarded-Proto  $forwarded_proto;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header Host               $host;

    server {
        listen 8080 reuseport;

        proxy_http_version 1.1;

        # No CSP here on purpose: the SSR layer owns it, because only it knows the per-request nonce.
        # A second edge-level CSP would be a policy the browser must ALSO satisfy.
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "DENY" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_value always;

        gzip on;
        gzip_comp_level 1;
        gzip_vary on;
        gzip_min_length 10240;
        gzip_proxied expired no-cache no-store private auth;

        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/json
            application/xml
            image/svg+xml;

        # OpenShift readiness/liveness probe. Served locally, never proxied.
        location = /hc {
            access_log off;

            return 200;
        }

        # Exact match, to stop a redirect — not to change a limit. A prefix location ending in `/` and
        # handled by proxy_pass makes nginx 301 the slashless URI, and a redirected DELETE arrives
        # without its body, which silently broke the bulk delete when `/api/app-versions/` was added.
        location = /api/app-versions {
            proxy_pass http://<app-name>-backend.<namespace>.svc.cluster.local:8080;
        }

        # Artifacts, large in BOTH directions (an Android build is 200 MB+). 501m mirrors the backend's
        # Kestrel limit so the EDGE never refuses first — move one, move both. Buffering off both ways
        # keeps hundreds of megabytes out of nginx's temp dir; the backend already streams.
        location /api/app-versions/ {
            client_max_body_size    501m;
            client_body_timeout     60;
            proxy_request_buffering off;
            proxy_buffering         off;
            proxy_send_timeout      300;
            proxy_read_timeout      300;
            send_timeout            300;

            proxy_pass http://<app-name>-backend.<namespace>.svc.cluster.local:8080;
        }

        # EXAMPLE — large streaming upload. Sized for parts of a few hundred MB; match
        # client_max_body_size to the endpoint's own cap. Request buffering off so the body streams
        # through rather than spooling to disk, which is also why the timeouts are raised.
        # Nothing sits at the bare path, so this prefix's 301 of it is harmless; delete this block
        # if you have no large-upload endpoint.
        location /api/<large-upload-endpoint>/ {
            client_max_body_size    1g;
            client_body_timeout     60;
            proxy_request_buffering off;
            proxy_send_timeout      300;
            proxy_read_timeout      300;

            proxy_pass http://<app-name>-backend.<namespace>.svc.cluster.local:8080;
        }

        # Backend API — fully-qualified cross-namespace name: this proxy runs in <environment>, the
        # backend in <namespace>.
        #
        # EXAMPLE — a response that outgrows the 256k of proxy_buffers (~900 KB here), so
        # buffering off rather than a disk write per page load. Nothing sits at `/api/config-reference`,
        # so this prefix's 301 of it is harmless; add a bare endpoint and it needs an exact match.
        location /api/config-reference/ {
            proxy_buffering off;

            proxy_pass http://<app-name>-backend.<namespace>.svc.cluster.local:8080;
        }

        # The other oversized response: 344 KB for a fully described 751-key translation. Regex, not a
        # `/api/languages/` prefix, so it cannot catch the device-facing `GET /api/languages/translation`
        # — buffering is what frees the backend connection there before a slow TV finishes reading.
        # Regex beats prefix, so this wins over `/api/`; `~*` because opco and lang resolve case-insensitively.
        location ~* ^/api/languages/[^/]+/[^/]+/translation/entries$ {
            proxy_buffering off;

            proxy_pass http://<app-name>-backend.<namespace>.svc.cluster.local:8080;
        }

        location /api/ {
            proxy_pass http://<app-name>-backend.<namespace>.svc.cluster.local:8080;
        }

        # Everything else — the SSR frontend (BFF), also in <namespace>.
        location / {
            proxy_pass http://<app-name>-frontend.<namespace>.svc.cluster.local:3000;
        }
    }
}
